name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - name: Validate marketplace + plugins
        run: |
          claude plugin validate . || exit 1
          for d in plugins/*/; do
            claude plugin validate "$d" || exit 1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: oxlint (code-style — curly, etc.)
        run: npx --yes oxlint@1.70.0 .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build bundles + node:test (shared parser, snip-hook)
        run: pnpm test
      # pnpm test has just built them (pretest)
      - name: bundles match their sources and are committed
        run: node scripts/check-bundles.mjs

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: no-bash functional tests
        run: node plugins/hooks/hooks/tests/run-no-bash-tests.mjs
      - name: no-bash redteam suite
        run: node plugins/hooks/hooks/tests/redteam-no-bash.mjs
      - name: no-bash mock-install proof
        run: node plugins/hooks/hooks/tests/mock-install-no-bash.mjs
      - name: no-bash full-scale validation (shlex oracle + seeded fuzz)
        run: node plugins/hooks/hooks/tests/validate-no-bash.mjs
      - name: no-bash benchmark (perf / no-ReDoS gate)
        run: node plugins/hooks/hooks/tests/bench-no-bash.mjs
      - name: workflow hooks (no-absolute-paths / force-plan-mode / fix-formatting / session-start)
        run: node plugins/hooks/hooks/tests/run-hook-tests.mjs
      - name: protocol-conformance + fail-open harness (all hooks, full stdin envelope)
        run: node plugins/hooks/hooks/tests/conformance-hooks.mjs
      - name: Run no-honest hook tests
        run: node plugins/hooks/hooks/tests/run-no-honest-tests.mjs
