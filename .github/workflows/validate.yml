name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - name: Validate marketplace + plugins
        run: |
          claude plugin validate --strict . || exit 1
          for plugin_dir in plugins/*/; do
            claude plugin validate --strict "$plugin_dir" || exit 1
          done

  # cross-agent portability: every skill must pass the Agent Skills spec
  # (agentskills.io), which `npx skills` installs into non-Claude agents.
  # `socket` is skipped: its Claude Code-only `argument-hint` field fails the spec.
  # Drop the skip once one of these lands:
  # - spec support for Claude Code fields: https://github.com/agentskills/agentskills/issues/105
  # - `skills-ref validate --allow-field`: https://github.com/agentskills/agentskills/pull/350
  # (the validator PR for these fields was declined: https://github.com/agentskills/agentskills/pull/277)
  skills-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install "git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: skills-ref validate
        run: |
          for skill_dir in plugins/*/skills/*/; do
            [[ "$skill_dir" == */skills/socket/ ]] && continue
            skills-ref validate "$skill_dir" || exit 1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: oxlint (code-style — curly, etc.)
        run: npx --yes oxlint@1.70.0 .

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: no-bash functional tests
        run: node plugins/hooks/hooks/tests/run-no-bash-tests.mjs
      - name: no-bash redteam suite
        run: node plugins/hooks/hooks/tests/redteam-no-bash.mjs
      - name: no-bash mock-install proof
        run: node plugins/hooks/hooks/tests/mock-install-no-bash.mjs
      - name: no-bash full-scale validation (shlex oracle + seeded fuzz)
        run: node plugins/hooks/hooks/tests/validate-no-bash.mjs
      - name: no-bash benchmark (perf / no-ReDoS gate)
        run: node plugins/hooks/hooks/tests/bench-no-bash.mjs
      - name: workflow hooks (no-absolute-paths / force-plan-mode / fix-formatting / session-start / no-idle-wait / no-honest core / no-tmp)
        run: node plugins/hooks/hooks/tests/run-hook-tests.mjs
      - name: protocol-conformance + fail-open harness (all hooks, full stdin envelope)
        run: node plugins/hooks/hooks/tests/conformance-hooks.mjs
      - name: no-honest Stop hook tests
        run: node plugins/hooks/hooks/tests/run-no-honest-tests.mjs
